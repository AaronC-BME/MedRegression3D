hydra:
  output_subdir: null
  job:
    chdir: False
  run:
    dir: .

override hydra/hydra_logging: disable
override hydra/job_logging: disable

# Path to a single training run directory.
# Must contain `Configs/config.yaml` (Hydra snapshot from training) and
# `folds/<k>/*.ckpt` (per-fold checkpoints saved by ModelCheckpoint).
run_dir: /home/jma/projects/aaron/Dataset/nnssl_dataset/nnssl_results/AgeOrdinalRegression/Refactored_Test

fold: 0  # if no fold is given, an ensemble of all available folds will be used (if only one fold is available this can be ignored)
pred_dir: null  # if null, predictions are written to <run_dir>/predictions/

# Optional: directory of preprocessed .b2nd images to predict on (no ground-truth labels needed).
# If null, predict.py runs val + test from the training CSV and computes metrics.
# If set, predict.py just runs forward inference on every .b2nd in the directory.
data_dir: null

metrics:
  - 'mae'
  - 'mse'
