# @package _global_
data:
  module:
    _target_: medregression3d.data.datamodules.AgeReg_DataModule
    name: AgeOrdinalRegression
    img_dir: /home/jma/projects/aaron/Dataset/nnssl_dataset/nnssl_preprocessed/Dataset003_LiverAge
    csv_file: /home/jma/projects/aaron/Dataset/nnssl_dataset/nnssl_preprocessed/Dataset003_LiverAge/liver_age_dataset.csv
    label_column: age
    batch_size: 4
    train_transforms:
      _target_: medregression3d.data.batchgenerators_transforms.get_training_transforms
      patch_size: ${data.patch_size}
      rotation_for_DA: 0.523599
      mirror_axes: [0,1,2]
      do_dummy_2d_data_aug: False
    test_transforms: 
      _target_: medregression3d.data.batchgenerators_transforms.get_test_transforms
      patch_size: ${data.patch_size}
      do_dummy_2d_data_aug: False
  cv:
    k: 1

  num_classes: 100
  patch_size: [160, 160, 160]

model:
  task: 'Ordinal_Regression' #'Classification'
  loss_fn: null # focal, topk10, topk20, bce_focal, bce_topk10, bce_topk20, weighted_bce, bce_mae
  cifar_size: False
  input_channels: 1
  input_dim: 3
  input_shape: ${data.patch_size}
  optimizer: AdamW
  lr: 0.001
  warmstart: 0
  warmstart2: 0
  weight_decay: 1e-2
  finetune_method: full_sawtooth


trainer:
  logger:
    project: nnSSL CT Images Age Regression
    name: Refactored_Test
  accumulate_grad_batches: 48
  max_epochs: 200
  sync_batchnorm: True

metrics:
  - 'mae' 
  - 'mse'
  #'f1'
  #- 'balanced_acc'
  #- 'ap'
  #- 'auroc'